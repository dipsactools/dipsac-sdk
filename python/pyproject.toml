[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "dipsac"
dynamic = ["version"]
description = "The official Python library for the DIPSAC API: PDF, image, audio, video and SEO tools, and the AI Voice Studio."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "DIPSAC", email = "contact@dipsac.com" }]
keywords = ["dipsac", "pdf", "image", "audio", "video", "text-to-speech", "transcription", "api", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.25,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "build>=1.2", "twine>=5"]

[project.urls]
Homepage = "https://dipsac.com"
Documentation = "https://dipsac.com/dashboard/reference"
Source = "https://github.com/khalidPathan7733/dipsac-sdk"
Issues = "https://github.com/khalidPathan7733/dipsac-sdk/issues"

[tool.hatch.version]
path = "src/dipsac/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dipsac"]

[tool.hatch.build.targets.sdist]
include = ["src/dipsac", "README.md", "LICENSE", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
