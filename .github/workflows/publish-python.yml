# Publishes the Python package to PyPI when a tag like python-v0.1.0 is pushed.
#
# NO TOKEN IS STORED. PyPI trusts this workflow in this repository directly
# ("trusted publishing"). One-time setup on pypi.org, Account -> Publishing ->
# "Add a new pending publisher":
#     PyPI project name   dipsac
#     Owner               khalidPathan7733
#     Repository name     dipsac-sdk
#     Workflow name       publish-python.yml
#     Environment name    pypi
name: publish-python
on:
  push:
    tags: ["python-v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # what trusted publishing signs in with
      contents: read
    defaults:
      run: { working-directory: python }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: The tag must be the version in the code
        run: |
          version=$(python -c "import dipsac; print(dipsac.__version__)")
          test "python-v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, code $version"; exit 1; }
      - run: python ../codegen/generate.py --check
      - run: pytest -q
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with: { packages-dir: python/dist }
