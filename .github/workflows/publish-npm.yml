# Publishes the npm package when a tag like js-v0.1.0 is pushed.
#
# NO TOKEN IS STORED. npm trusts this workflow in this repository directly
# ("trusted publishing"). It can only be switched on for a package that already
# exists, so the FIRST version is published by hand (npm login, npm publish) and
# every later one from here. One-time setup on npmjs.com, the package's
# Settings -> Trusted Publisher -> GitHub Actions:
#     Organization or user   khalidPathan7733
#     Repository             dipsac-sdk
#     Workflow filename      publish-npm.yml
name: publish-npm
on:
  push:
    tags: ["js-v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # what trusted publishing signs in with
      contents: read
    defaults:
      run: { working-directory: js }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", registry-url: "https://registry.npmjs.org" }
      - run: npm install -g npm@latest     # trusted publishing needs npm 11.5.1 or newer
      - run: npm ci
      - name: The tag must be the version in package.json
        run: |
          version=$(node -p "require('./package.json').version")
          test "js-v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, package.json $version"; exit 1; }
      - run: npm test
      - run: npm publish --access public
